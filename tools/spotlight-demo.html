<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>顶部聚光灯 · 赛场氛围演示</title>
<style>
  :root{--bg:#05070c;--panel:#0f1622;--line:#1c2638;--txt:#dbe6f5;--dim:#7d8ea6;--accent:#5aa9ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:flex;height:100%}
  #stage{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:14px;top:12px;pointer-events:none;
    background:rgba(5,8,14,.72);border:1px solid var(--line);border-radius:10px;
    padding:9px 13px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);font-size:12px}
  #hud b{font-size:16px;color:#fff}
  #hud .row{display:flex;gap:15px}
  #hint{position:absolute;right:14px;top:12px;background:rgba(5,8,14,.72);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--accent)}
  aside{width:286px;flex:0 0 286px;background:var(--panel);border-left:1px solid var(--line);
    padding:15px;overflow-y:auto}
  h1{font-size:15px;margin:0 0 3px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:15px;line-height:1.5}
  .grp{margin-bottom:15px}
  .grp>.t{font-size:12px;color:var(--dim);letter-spacing:.04em;margin-bottom:6px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  button{background:#16202f;color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;cursor:pointer;font:inherit;font-size:13px;transition:.15s}
  button:hover{border-color:#2f4a6e;background:#1b2739}
  button.on{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  label.sw{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12.5px;cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .val{color:var(--accent);font-variant-numeric:tabular-nums;font-size:11.5px}
  .note{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:5px}
  .stat{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
  .stat span:last-child{color:var(--accent);font-variant-numeric:tabular-nums}
  .sep{height:1px;background:var(--line);margin:13px 0}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="row">
        <div><b id="fps">—</b><div style="color:var(--dim);font-size:11px">fps</div></div>
        <div><b id="ms">—</b><div style="color:var(--dim);font-size:11px">ms/帧</div></div>
        <div><b id="lights">—</b><div style="color:var(--dim);font-size:11px">灯数</div></div>
      </div>
    </div>
    <div id="hint">拖动旋转 · 滚轮推拉</div>
  </div>

  <aside>
    <h1>顶部聚光灯</h1>
    <div class="sub">两盏主灯锁定球员，其余为环境补光。光束用 Kenney Light Masks（CC0）锥形遮罩绘制。</div>

    <div class="grp">
      <div class="t">模式</div>
      <div class="seg" id="modeSeg">
        <button data-v="match" class="on">比赛（2 主灯）</button>
        <button data-v="sweep">扫场（4 灯扫动）</button>
        <button data-v="off">关闭</button>
      </div>
      <div class="note">比赛＝灯始终跟随球员位置；扫场＝灯光在场地上缓慢扫过，适合开场/得分。</div>
    </div>

    <div class="grp">
      <div class="t">氛围</div>
      <div class="seg" id="ambSeg">
        <button data-v="normal" class="on">常规</button>
        <button data-v="dark">压暗（更聚光）</button>
        <button data-v="party">高亮（演唱会）</button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="grp">
      <div class="t">参数</div>
      <label class="sw">光束强度 <span class="val" id="vBeam">0.55</span></label>
      <input type="range" id="rBeam" min="0" max="1" step="0.02" value="0.55"/>
      <label class="sw">光斑亮度 <span class="val" id="vPool">0.5</span></label>
      <input type="range" id="rPool" min="0" max="1" step="0.02" value="0.5"/>
      <label class="sw">边缘柔化 <span class="val" id="vSoft">0.7</span></label>
      <input type="range" id="rSoft" min="0" max="1" step="0.02" value="0.7"/>
      <label class="sw">环境暗角 <span class="val" id="vVig">0.45</span></label>
      <input type="range" id="rVig" min="0" max="1" step="0.02" value="0.45"/>
      <label class="sw">摆动幅度 <span class="val" id="vSway">0.12</span></label>
      <input type="range" id="rSway" min="0" max="0.5" step="0.01" value="0.12"/>
    </div>

    <div class="sep"></div>
    <div class="grp">
      <div class="t">实测</div>
      <div class="stat"><span>灯数</span><span id="sL">—</span></div>
      <div class="stat"><span>drawImage/帧</span><span id="sD">—</span></div>
      <div class="note">光束与光斑各一次 drawImage；叠加以 <code>lighter</code> 混合，无需逐像素运算。</div>
    </div>
  </aside>
</div>

<script src="../public/js/engine/rules.js"></script>
<script src="../public/js/engine/math.js"></script>
<script src="../public/js/engine/state.js"></script>
<script src="../public/js/engine/physics.js"></script>
<script src="../public/js/engine/shots.js"></script>
<script src="../public/js/engine/strokes.js"></script>
<script src="../public/js/engine.js"></script>
<script src="../public/js/render.js"></script>
<script src="../public/js/characters.js"></script>
<script>
'use strict';
const R = window.TTG;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ───────── 配置 ───────── */
const P = {
  mode: 'match',      // match | sweep | off
  amb: 'normal',      // normal | dark | party
  beam: 0.55, pool: 0.5, soft: 0.7, vig: 0.45, sway: 0.12,
  yaw: 0, pitch: 0, zoom: 1,
};

/* ───────── 素材：Kenney Light Masks（CC0） ───────── */
const ASSET = 'demo-assets/';
const IMG = {};
function loadImg(name) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);   // 缺图不崩，回退到程序化渐变
    im.src = ASSET + name;
  });
}
let READY = false;
Promise.all([
  loadImg('cone_composed_a.png'), loadImg('cone_composed_b.png'),
  loadImg('circle_a.png'), loadImg('circle_b.png'),
]).then(([coneA, coneB, circA, circB]) => {
  IMG.coneA = coneA; IMG.coneB = coneB; IMG.circA = circA; IMG.circB = circB;
  READY = true;
});

/* ───────── 观众（沿用上一版应援棒画法） ───────── */
function crowdLayout(density) {
  const step = 0.46 / density;
  const list = []; let seed = 20260804;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const person = (x, y, z) => ({ x: x + (rnd() - .5) * .2, y: y + (rnd() - .5) * .1, z, ph: rnd() * 6.283 });
  for (const ez of [-6.35, 6.35]) for (let row = 3; row >= 0; row--) {
    const z = ez + row * 0.5;
    for (let x = -5.2; x <= 5.2; x += step) list.push(person(x, 0.25 + row * 0.48, z));
  }
  for (const sx of [-1, 1]) for (let row = 3; row >= 0; row--) {
    const x = sx * (3.62 + row * 0.55);
    for (let z = -5.5; z <= 5.5; z += step) list.push(person(x, 0.25 + row * 0.48, z + (rnd() - .5) * .2));
  }
  return list;
}
const LIST = crowdLayout(1);
const RED = [255, 92, 72], BLUE = [86, 152, 255];
const teamOf = s => (s.x < 0 ? 0 : 1);

/* ───────── 相机（对齐产品 makeCam） ───────── */
const cam = new R.Camera();
let W = 0, H = 0, DPR = 1;
function updateCam() {
  const look = R.v3(0, 1.7, 0);
  const eye0 = R.v3(0, 4.8, -5.20);
  const dx = eye0.x - look.x, dy = eye0.y - look.y, dz = eye0.z - look.z;
  const cy = Math.cos(P.yaw), sy = Math.sin(P.yaw);
  let rx = dx * cy - dz * sy, rz = dx * sy + dz * cy;
  const cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
  const ry = dy * cp - rz * sp, rz2 = dy * sp + rz * cp;
  const k = 1 / P.zoom;
  cam.set(R.v3(look.x + rx * k, look.y + ry * k, look.z + rz2 * k), look,
          W / 2, H * 0.52, Math.min(W, H) * 0.92 * P.zoom);
}
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(r.width); H = Math.round(r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  updateCam();
}

/* ───────── 球员 ───────── */
function makePlayer(side) {
  return { side, x: 0, z: side === 0 ? -1.65 : 1.65, vx: 0, vz: 0,
           facing: side === 0 ? 1 : -1, crouch: false,
           stroke: { active: false, type: 0, t: 0, dur: .4 }, paddle: 0 };
}
const players = [makePlayer(0), makePlayer(1)];

/* ───────── 灯光 ─────────
   聚光灯三要素（缺一不可）：
     ① 光束（空中锥形，从顶部灯位到地面光斑）
     ② 地面光斑（椭圆，被透视压扁）
     ③ 环境压暗（光斑外变暗 ⇒ 对比产生"聚光"感）
   全部用 'lighter' 混合叠加，避免逐像素运算。 */
const LIGHTS = [
  { team: 0, baseX: -1.1, baseZ: -2.6, r: 1.55 },
  { team: 1, baseX: 1.1, baseZ: 2.6, r: 1.55 },
];
const SWEEP = [
  { team: 0, ax: 3.2, az: 1.6, sp: 0.42, ph: 0 },
  { team: 1, ax: 3.2, az: 1.6, sp: 0.42, ph: Math.PI },
  { team: 0, ax: 2.2, az: 2.6, sp: 0.31, ph: 1.1 },
  { team: 1, ax: 2.2, az: 2.6, sp: 0.31, ph: 2.9 },
];

/* 灯位：球馆顶部。4.2m + 靠近球员上方——太远会把灯投到画面外，只剩无源白柱。 */
const LAMP_Y = 4.2;

/* ═══════════════════════════════════════════════════════════════
 * 光照架构（2026-10-22 重做 v2）：快照 → 压暗 → 按遮罩贴回原图
 *
 * 上一版的错误：用 destination-out 直接擦画布 ⇒ 擦出的是**透明**，
 * 露出下面的黑底 ⇒ 光斑变成黑洞。destination-out 只能擦掉"画布上的像素"，
 * 擦不出"原本更亮的画面"。
 *
 * 正确做法（也是游戏引擎里 shadow-mask 灯光的标准做法）：
 *   ① 先把「完整场景」快照到一张离屏 canvas
 *   ② 主画布上整体压暗
 *   ③ 用遮罩贴图做 destination-in，把快照里「光斑区域」贴回主画布
 *      ⇒ 光斑内 = 快照原亮度（≤1.0，不可能过曝）
 *      ⇒ 光斑外 = 压暗后的画面
 *
 * 这样灯光是纯减法：只有光斑里恢复原样，其余变暗。
 * 玩家要看的球/球员/台面在光斑内**完全清晰**，且亮度不超过原图。
 * ═══════════════════════════════════════════════════════════════ */

/* 离屏快照画布（按主画布尺寸，resize 时重建） */
let SNAP = null, SNAP_CTX = null;
function ensureSnap() {
  const w = cv.width, h = cv.height;
  if (!SNAP) {
    SNAP = document.createElement('canvas');
    SNAP_CTX = SNAP.getContext('2d');
  }
  if (SNAP.width !== w || SNAP.height !== h) { SNAP.width = w; SNAP.height = h; }
  return SNAP_CTX;
}

/* 把当前主画布内容快照下来（在压暗之前调用） */
function takeSnapshot() {
  const sc = ensureSnap();
  sc.setTransform(1, 0, 0, 1, 0, 0);
  sc.clearRect(0, 0, SNAP.width, SNAP.height);
  sc.drawImage(cv, 0, 0);
}

/* 压暗层：整屏乘暗系数。中下部（球台区）压得轻，上下缘压得重 */
function drawDarken(strength) {
  if (strength <= 0.01) return;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(2,4,8,${Math.min(1, strength * 1.3)})`);
  g.addColorStop(0.45, `rgba(2,4,8,${strength * 0.68})`);
  g.addColorStop(0.75, `rgba(2,4,8,${strength * 0.52})`);
  g.addColorStop(1, `rgba(2,4,8,${Math.min(1, strength * 1.15)})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* 光斑贴回：用遮罩贴图把快照的「光斑区域」画回主画布。
   做法：在一张临时画布上，先用遮罩形状裁剪，再把快照贴上去，
   最后把这张临时画布以 source-over 叠回主画布。 */
let POOL_TMP = null, POOL_CTX = null;
function ensurePoolTmp() {
  const w = cv.width, h = cv.height;
  if (!POOL_TMP) { POOL_TMP = document.createElement('canvas'); POOL_CTX = POOL_TMP.getContext('2d'); }
  if (POOL_TMP.width !== w || POOL_TMP.height !== h) { POOL_TMP.width = w; POOL_TMP.height = h; }
  return POOL_CTX;
}

/* 多光斑并集贴回。
   ⚠ 合成顺序是唯一的坑：
     destination-in = 「保留**目标**颜色，用**源**的 alpha 裁剪」。
     ⇒ 必须 ① 先画快照（目标＝原始画面） ② 再用遮罩 alpha 裁剪。
     反过来（先画遮罩、再 destination-in 贴快照）保留的是**遮罩的白色** ⇒ 一坨白斑。
   多盏灯要取并集，故遮罩先单独累积到 MASK 画布，再一次性裁。 */
let MASK = null, MASK_CTX = null;
function ensureMask() {
  const w = cv.width, h = cv.height;
  if (!MASK) { MASK = document.createElement('canvas'); MASK_CTX = MASK.getContext('2d'); }
  if (MASK.width !== w || MASK.height !== h) { MASK.width = w; MASK.height = h; }
  return MASK_CTX;
}

function drawPoolsRestore(pools, imgPoolA, imgPoolB) {
  if (!pools.length || !SNAP) return 0;
  const mc = ensureMask();

  /* ① 遮罩画布：把所有光斑**累加**成并集（lighter 保证重叠区不被冲淡） */
  mc.setTransform(1, 0, 0, 1, 0, 0);
  mc.globalCompositeOperation = 'source-over';
  mc.globalAlpha = 1;
  mc.clearRect(0, 0, MASK.width, MASK.height);
  mc.globalCompositeOperation = 'lighter';

  let drawn = 0;
  for (const p of pools) {
    const pr = cam.project(p.target);
    if (!pr) continue;
    const rx = p.radius * pr.s;
    const ry = rx * 0.42;
    if (rx < 2) continue;
    const img = p.team === 0 ? imgPoolA : imgPoolB;
    mc.globalAlpha = p.strength;
    if (img) {
      mc.drawImage(img, pr.x - rx, pr.y - ry, rx * 2, ry * 2);
    } else {
      const g = mc.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, rx);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.5, 'rgba(255,255,255,.75)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      mc.fillStyle = g;
      mc.beginPath(); mc.ellipse(pr.x, pr.y, rx, ry, 0, 0, 7); mc.fill();
    }
    drawn++;
  }
  mc.globalAlpha = 1;
  mc.globalCompositeOperation = 'source-over';
  if (!drawn) return 0;

  /* ② 临时画布：目标＝快照，源＝遮罩 alpha（destination-in 裁剪） */
  const pc = ensurePoolTmp();
  pc.setTransform(1, 0, 0, 1, 0, 0);
  pc.globalCompositeOperation = 'source-over';
  pc.globalAlpha = 1;
  pc.clearRect(0, 0, POOL_TMP.width, POOL_TMP.height);
  pc.drawImage(SNAP, 0, 0);
  pc.globalCompositeOperation = 'destination-in';
  pc.drawImage(MASK, 0, 0);
  pc.globalCompositeOperation = 'source-over';

  /* ③ 贴回主画布（覆盖压暗后的画面） */
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(POOL_TMP, 0, 0);
  ctx.restore();
  return drawn;
}

/* 光束：极低 alpha 的锥形，只做"空气感"。
   真实球馆的灯束只有在烟尘里才可见；转播里几乎看不到实体。
   纵向衰减：近灯处几乎透明（否则会有一根白柱直插画面）。 */
function drawBeam(lampPos, targetPos, radius, alpha, tint, img) {
  if (alpha <= 0.005) return 0;
  const pLamp = cam.project(lampPos);
  const pTgt = cam.project(targetPos);
  if (!pLamp || !pTgt) return 0;

  const halfW = radius * pTgt.s;
  const beamH = pTgt.y - pLamp.y;
  if (beamH <= 2 || halfW <= 1) return 0;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const w = halfW * 2 * 1.35;
  const h = Math.max(4, beamH);

  if (img) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, pLamp.x - w / 2, pLamp.y, w, h);
  } else {
    const g = ctx.createLinearGradient(0, pLamp.y, 0, pTgt.y);
    g.addColorStop(0, `rgba(${tint},0)`);
    g.addColorStop(0.45, `rgba(${tint},${alpha * 0.35})`);
    g.addColorStop(1, `rgba(${tint},${alpha})`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(pLamp.x - 2, pLamp.y);
    ctx.lineTo(pLamp.x + 2, pLamp.y);
    ctx.lineTo(pTgt.x + halfW, pTgt.y);
    ctx.lineTo(pTgt.x - halfW, pTgt.y);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  return 1;
}

/* 灯具本体：光束得有"来源"，否则只是一根凭空出现的白柱。
   画一个发光的小椭圆 + 光晕（程序化，不依赖贴图）。 */
/* 灯具：只留一个小亮点 + 很淡的光晕。
   ⚠ 旧版画了 alpha 0.95 的白芯 + 0.55 的光晕，是"晃眼"的第二大来源
   （第一是光束+光斑的 lighter 叠加）。转播里的灯位就是一个针尖大小的亮点。 */
function drawLamp(lampPos, tint, intensity) {
  const p = cam.project(lampPos);
  if (!p) return 0;
  /* 灯在 4.2m 高处、离相机约 4m，投影缩放 s≈150+ ⇒ 世界半径必须极小（0.04m） */
  const r = Math.max(1.6, 0.04 * p.s);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 淡光晕（0.28 而非 0.55） */
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 5);
  g.addColorStop(0, `rgba(${tint},${0.28 * intensity})`);
  g.addColorStop(0.35, `rgba(${tint},${0.07 * intensity})`);
  g.addColorStop(1, `rgba(${tint},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 5, 0, 7); ctx.fill();
  /* 灯芯：小亮点（0.8 而非 0.95，且更小） */
  ctx.fillStyle = `rgba(255,252,240,${0.8 * intensity})`;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.7, 0, 0, 7); ctx.fill();
  ctx.restore();
  return 1;
}

/* 轻微暗角：只压四周边缘（不碰光斑内的画面要素）。
   ⚠ 旧版这里是主压暗层，现在压暗已交给 drawDarken + erasePool，
   本层只负责「四角收边」，强度必须很小（≤0.3），否则又会把画面压死。 */
function drawVignette(time) {
  const strength = { normal: P.vig * 0.45, dark: P.vig * 0.6, party: P.vig * 0.25 }[P.amb];
  if (strength <= 0.01) return;
  const g = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.42,
                                     W / 2, H * 0.55, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ───────── 应援棒辉光：离屏预烘焙，替代逐图元 shadowBlur ─────────
   ⚠ 这是本 demo 最重要的一处性能修正：
   Canvas2D 的 shadowBlur 是**逐图元**的高斯模糊，376 根棒 = 376 次离屏模糊，
   实测把帧率从 60 压到 46。改用一张预烘焙的径向渐变光斑，按棒端点 drawImage 即可，
   每帧只是 376 次位图拷贝（GPU 加速），开销低一个数量级。 */
let GLOW = null;
function buildGlow() {
  const S = 64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g2 = c.getContext('2d');
  const g = g2.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  g2.fillStyle = g;
  g2.fillRect(0, 0, S, S);
  GLOW = c;
}
buildGlow();

/* 用预烘焙光斑画一根发光棒。
   ⚠ 性能关键：**不要在循环里反复切换 globalCompositeOperation**——
   每次切换都会刷新渲染状态（实测把 60fps 压到 44）。正确做法是分两批：
   先整批画棒身（source-over），再整批画光斑（lighter），每批只切一次。 */
function drawStickGlow(x1, y1, x2, y2, w, col, alpha, glowScale) {
  ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

/* ───────── 场景 ───────── */
function drawCrowd(time) {
  const sorted = LIST.slice().sort((a, b) =>
    cam.depth(R.v3(b.x, b.y, b.z)) - cam.depth(R.v3(a.x, a.y, a.z)));
  ctx.fillStyle = 'rgba(16,22,34,.72)';
  for (const s of sorted) {
    const b = cam.project(R.v3(s.x, s.y + .30, s.z));
    if (!b) continue;
    const w = Math.max(1.2, .13 * b.s), h = Math.max(1.8, .22 * b.s);
    ctx.fillRect(b.x - w / 2, b.y - h / 2, w, h);
  }
  ctx.lineCap = 'round';
  const bright = P.amb === 'party' ? 1.15 : P.amb === 'dark' ? 0.7 : 1;

  /* 第一批：棒身（全部 source-over，零状态切换） */
  const tips = [];
  for (const team of [0, 1]) {
    const col = team === 0 ? RED : BLUE;
    for (const s of sorted) {
      if (teamOf(s) !== team) continue;
      const pb = cam.project(R.v3(s.x, s.y + .60, s.z));
      if (!pb) continue;
      const sN = Math.max(0, Math.min(1, (pb.s - 60) / 90));
      const att = 1 - sN * 0.65;
      const far = Math.max(0, Math.min(1, (110 - pb.s) / 50));
      const w = Math.max(1.4, .035 * pb.s * att) * (1 + far * .35);
      const alpha = Math.min(1, ((.45 + .5 * (1 - sN)) * bright) + far * .25);
      const swing = Math.sin(time * 3 + s.ph) * 0.38;
      const L = .36 * (0.96 - sN * .35);
      const tip = R.v3(s.x + Math.sin(swing) * L, s.y + .60 + Math.cos(swing) * L, s.z);
      const pt = cam.project(tip);
      if (!pt) continue;
      drawStickGlow(pb.x, pb.y, pt.x, pt.y, w, col, alpha, 1.8);
      tips.push([pt.x, pt.y, w, alpha]);
    }
  }

  /* 第二批：光斑（整批只切一次 lighter） */
  if (GLOW && tips.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (const [x, y, w, alpha] of tips) {
      const gs = Math.max(4, w * 1.8);
      ctx.globalAlpha = Math.min(0.75, alpha * 0.6);
      ctx.drawImage(GLOW, x - gs / 2, y - gs / 2, gs, gs);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ───────── 主循环 ───────── */
let lastT = performance.now(), acc = [], t0 = performance.now();
let DRAW_IMAGES = 0;

function frame(now) {
  const dt = now - lastT; lastT = now;
  const time = (now - t0) / 1000;
  DRAW_IMAGES = 0;

  /* 背景 */
  const bgDark = P.amb === 'dark' ? 0.55 : 1;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(4,6,11,${bgDark})`);
  g.addColorStop(.55, `rgba(9,13,22,${bgDark})`);
  g.addColorStop(1, `rgba(7,10,17,${bgDark})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* 地板/球台/球网 */
  R.drawFloor(ctx, cam, W, H, time, 0, null, false, 1, true, false);
  R.drawTable(ctx, cam);
  R.drawNet(ctx, cam);

  /* 球员位置（轻微移动） */
  for (const pl of players) {
    pl.x = Math.sin(time * 0.85 + pl.side * 2.2) * 0.7;
    pl.vx = Math.cos(time * 0.85 + pl.side * 2.2) * 0.7 * 0.85;
  }

  /* ② 球员 + ③ 观众 —— 先把「完整画面」画好 */
  for (const pl of players) {
    if (R.drawCharacter) R.drawCharacter(ctx, cam, pl, null, time, 0, false, false);
  }
  drawCrowd(time);

  /* ④ 光照：快照 → 压暗 → 光斑贴回 → 淡光束
     顺序不可换：快照必须在压暗之前，否则贴回的是"压暗后的自己"。 */
  let lightCount = 0;
  if (P.mode !== 'off') {
    const amb = {
      normal: { dark: 0.55, pool: 0.95, beam: 0.12 },
      dark:   { dark: 0.76, pool: 0.98, beam: 0.09 },
      party:  { dark: 0.36, pool: 0.88, beam: 0.20 },
    }[P.amb];

    /* ④a 快照（此时是完整、未经压暗的画面） */
    takeSnapshot();

    /* ④b 压暗 */
    drawDarken(amb.dark);

    /* ④c 光斑：把快照的光斑区域贴回（亮度 = 原图，不可能过曝） */
    const list = P.mode === 'sweep' ? SWEEP : LIGHTS;
    const pools = [];
    const targets = [];
    for (const L of list) {
      let tx, tz, radius = L.r;
      if (P.mode === 'sweep') {
        tx = Math.sin(time * L.sp + L.ph) * L.ax;
        tz = Math.cos(time * L.sp * 0.8 + L.ph) * L.az;
        radius = 1.7;
      } else {
        const pl = players[L.team];
        tx = pl.x + Math.sin(time * 0.7 + L.team) * P.sway;
        tz = pl.z;
      }
      const tint = L.team === 0 ? '255,170,150' : '150,190,255';
      const target = R.v3(tx, 0.76, tz);
      const lamp = R.v3(tx * 0.55, LAMP_Y, tz * 0.55 + (L.team === 0 ? -1.2 : 1.2));
      pools.push({ target, radius, strength: amb.pool, team: L.team });
      targets.push({ L, tint, target, lamp, radius });
    }
    DRAW_IMAGES += drawPoolsRestore(pools, IMG.circA, IMG.circB);

    /* ④d 光束：极低 alpha，只做空气感 */
    for (const { L, tint, target, lamp, radius } of targets) {
      const beamImg = L.team === 0 ? IMG.coneA : IMG.coneB;
      DRAW_IMAGES += drawBeam(lamp, target, radius, Math.min(P.beam, amb.beam), tint, beamImg);
      DRAW_IMAGES += drawLamp(lamp, tint, 0.85);
      lightCount++;
    }
  }

  /* ④d 轻微暗角（最上层，仅压四周，不影响光斑内画面） */
  drawVignette(time);

  /* HUD */
  acc.push(dt); if (acc.length > 30) acc.shift();
  const avg = acc.reduce((a, b) => a + b, 0) / acc.length;
  document.getElementById('fps').textContent = (1000 / avg).toFixed(0);
  document.getElementById('ms').textContent = avg.toFixed(1);
  document.getElementById('lights').textContent = lightCount;
  document.getElementById('sL').textContent = lightCount;
  document.getElementById('sD').textContent = DRAW_IMAGES;

  requestAnimationFrame(frame);
}

/* ───────── 交互 ───────── */
function seg(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...el.querySelectorAll('button')].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    P[key] = b.dataset.v;
  });
}
seg('modeSeg', 'mode');
seg('ambSeg', 'amb');
const bind = (rid, vid, key, fmt) => {
  const r = document.getElementById(rid), v = document.getElementById(vid);
  r.addEventListener('input', () => { P[key] = +r.value; v.textContent = fmt(+r.value); });
};
bind('rBeam', 'vBeam', 'beam', x => x.toFixed(2));
bind('rPool', 'vPool', 'pool', x => x.toFixed(2));
bind('rSoft', 'vSoft', 'soft', x => x.toFixed(2));
bind('rVig', 'vVig', 'vig', x => x.toFixed(2));
bind('rSway', 'vSway', 'sway', x => x.toFixed(2));

let drag = false, lx = 0, ly = 0;
cv.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('pointerup', () => { drag = false; });
window.addEventListener('pointermove', e => {
  if (!drag) return;
  P.yaw -= (e.clientX - lx) * 0.005;
  P.pitch = Math.max(-0.2, Math.min(0.6, P.pitch + (e.clientY - ly) * 0.003));
  lx = e.clientX; ly = e.clientY; updateCam();
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  P.zoom = Math.max(0.6, Math.min(1.8, P.zoom * (e.deltaY > 0 ? 0.94 : 1.06)));
  updateCam();
}, { passive: false });

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
