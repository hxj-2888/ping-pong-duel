<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>观众席「应援棒」风格 · 实时演示</title>
<style>
  :root{--bg:#080b12;--panel:#111826;--line:#1e2a3d;--txt:#dbe6f5;--dim:#7d8ea6;--accent:#4da3ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:flex;height:100%}
  #stage{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:14px;top:12px;pointer-events:none;
    background:rgba(8,12,20,.72);border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
  #hud .k{color:var(--dim);font-size:12px}
  #hud b{font-size:17px;color:#fff}
  #hud .row{display:flex;gap:16px}
  #badge{position:absolute;right:14px;top:12px;background:rgba(8,12,20,.72);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--accent)}
  aside{width:290px;flex:0 0 290px;background:var(--panel);border-left:1px solid var(--line);
    padding:16px;overflow-y:auto}
  h1{font-size:15px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  .grp{margin-bottom:16px}
  .grp>.t{font-size:12px;color:var(--dim);letter-spacing:.04em;margin-bottom:7px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  button{background:#182236;color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:7px 11px;cursor:pointer;font:inherit;transition:.15s}
  button:hover{border-color:#33507a;background:#1d2a41}
  button.on{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  label.sw{display:flex;align-items:center;justify-content:space-between;
    padding:6px 0;font-size:13px;cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .val{color:var(--accent);font-variant-numeric:tabular-nums;font-size:12px}
  .note{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:6px}
  .stat{display:flex;justify-content:space-between;padding:3px 0;font-size:12.5px}
  .stat span:last-child{color:var(--accent);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="k">每帧路径数</div>
      <div class="row">
        <div><b id="paths">—</b><div class="k">paths</div></div>
        <div><b id="fps">—</b><div class="k">fps</div></div>
        <div><b id="ms">—</b><div class="k">ms/帧</div></div>
      </div>
    </div>
    <div id="badge">拖动画面可旋转视角</div>
  </div>

  <aside>
    <h1>观众席 · 应援棒风格</h1>
    <div class="sub">同一相机、同 376 个座位，只换画法</div>

    <div class="grp">
      <div class="t">风格</div>
      <div class="seg" id="styleSeg">
        <button data-v="stick" class="on">应援棒（新）</button>
        <button data-v="figure">火柴人（现状）</button>
      </div>
    </div>

    <div class="grp">
      <div class="t">密度</div>
      <div class="seg" id="densSeg">
        <button data-v="1" class="on">满员 376</button>
        <button data-v="0.5">半场 192</button>
        <button data-v="0.25">省电 96</button>
      </div>
    </div>

    <div class="grp">
      <div class="t">情绪</div>
      <div class="seg" id="moodSeg">
        <button data-v="idle" class="on">平静</button>
        <button data-v="cheer">欢呼</button>
        <button data-v="shake">失望</button>
      </div>
      <div class="note">欢呼＝挥动更快更亮；失望＝垂下并缓慢摆动。对应现有 <code>fan.cheer</code> / <code>fan.shake</code>。</div>
    </div>

    <div class="grp">
      <div class="t">参数</div>
      <label class="sw">近排衰减 <span class="val" id="vAtt">0.65</span></label>
      <input type="range" id="rAtt" min="0" max="1" step="0.05" value="0.65"/>
      <label class="sw">辉光强度 <span class="val" id="vGlow">12</span></label>
      <input type="range" id="rGlow" min="0" max="30" step="1" value="12"/>
      <label class="sw">挥动幅度 <span class="val" id="vSwing">0.38</span></label>
      <input type="range" id="rSwing" min="0" max="0.9" step="0.02" value="0.38"/>
    </div>

    <div class="grp">
      <div class="t">实测</div>
      <div class="stat"><span>观众数</span><span id="sN">—</span></div>
      <div class="stat"><span>本帧路径</span><span id="sP">—</span></div>
      <div class="stat"><span>相对火柴人</span><span id="sR">—</span></div>
      <div class="note">路径数按实际绘制调用计数（火柴人 8 条/人，应援棒 2 条/人），非估算。</div>
    </div>
  </aside>
</div>

<!-- 必须按 index.html 的顺序加载：engine 依赖前面 6 个模块 -->
<script src="../public/js/engine/rules.js"></script>
<script src="../public/js/engine/math.js"></script>
<script src="../public/js/engine/state.js"></script>
<script src="../public/js/engine/physics.js"></script>
<script src="../public/js/engine/shots.js"></script>
<script src="../public/js/engine/strokes.js"></script>
<script src="../public/js/engine.js"></script>
<script src="../public/js/render.js"></script>
<script src="../public/js/characters.js"></script>
<script>
'use strict';
const R = window.TTG;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { willReadFrequently: false });

/* ───────── 参数（面板可调） ───────── */
const P = {
  style: 'stick',      // stick | figure
  density: 1,
  mood: 'idle',        // idle | cheer | shake
  att: 0.65,           // 近排衰减强度
  glow: 12,            // 辉光强度
  swing: 0.38,         // 挥动幅度(弧度)
  yaw: 0,              // 相机绕 Y 轴
  pitch: 0,
};

/* ───────── 观众布局：与产品 crowdLayout 完全同种子同步长 ───────── */
function crowdLayout(density) {
  const d = density == null ? 1 : density;
  const step = 0.46 / d;
  const list = [];
  let seed = 20260804;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const person = (x, y, z) => ({ x: x + (rnd() - .5) * .2, y: y + (rnd() - .5) * .1, z, ph: rnd() * 6.283, c: rnd() });
  for (const ez of [-6.35, 6.35]) {
    for (let row = 3; row >= 0; row--) {
      const z = ez + row * 0.5;
      for (let x = -5.2; x <= 5.2; x += step) list.push(person(x, 0.25 + row * 0.48, z));
    }
  }
  for (const sx of [-1, 1]) {
    for (let row = 3; row >= 0; row--) {
      const x = sx * (3.62 + row * 0.55);
      for (let z = -5.5; z <= 5.5; z += step) list.push(person(x, 0.25 + row * 0.48, z + (rnd() - .5) * .2));
    }
  }
  return list;
}
let LIST = crowdLayout(P.density);
let PATH_COUNT = 0;   // 本帧实际路径计数

const RED = [255, 92, 72], BLUE = [86, 152, 255];
const teamOf = s => (s.x < 0 ? 0 : 1);
const colOf = s => (teamOf(s) === 0 ? RED : BLUE);

/* ───────── 相机 ───────── */
const cam = new R.Camera();
let W = 0, H = 0, DPR = 1;

function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(r.width); H = Math.round(r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  updateCam();
}
function updateCam() {
  /* 相机口径对齐产品 app/render.js makeCam()：
     eye=(camX, 4.8, side===0 ? -5.20 : 5.20)，look=(camX*0.55, 1.7, 0)，focal≈min(W,H)*0.92。
     即「站在己方端线后方、4.8m 高处、俯视球台」。
     yaw/pitch 只在**产品机位基础上**做小幅绕转（绕 look 点），不能把相机拉到球台上方。 */
  const SIDE = 0;
  const baseZ = (SIDE === 0 ? -5.20 : 5.20);
  const camX = 0;
  const eye0 = R.v3(camX, 4.8, baseZ);
  const look = R.v3(camX * 0.55, 1.7, 0);

  /* 绕 look 点做小角度旋转（yaw 绕 Y、pitch 绕水平轴） */
  const yaw = P.yaw, pitch = P.pitch;
  const dx = eye0.x - look.x, dy = eye0.y - look.y, dz = eye0.z - look.z;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  let rx = dx * cy - dz * sy;
  let rz = dx * sy + dz * cy;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const ry = dy * cp - rz * sp;
  const rz2 = dy * sp + rz * cp;

  const eye = R.v3(look.x + rx, look.y + ry, look.z + rz2);
  cam.set(eye, look, W / 2, H * 0.52, Math.min(W, H) * 0.92);
}

/* ───────── 场景：地板/球台/球网/球员（复用真实绘制） ───────── */
function drawSceneBase(time) {
  /* 地板背景（不含观众）——noCrowd=true 只画地板与看台 */
  R.drawFloor(ctx, cam, W, H, time, 0, null, false, P.density, true, false);
  R.drawTable(ctx, cam);
  R.drawNet(ctx, cam);
}

/* 球员：用真实 drawCharacter（需要完整 player 对象） */
function makePlayer(side, x) {
  /* 站位必须与产品一致：PLAYER_Z = 1.65（球台半长 1.37 ⇒ 站在端线外）。
     此前误用 1.65 的符号反了，导致球员"站到台面上"。 */
  return {
    side, x, z: side === 0 ? -1.65 : 1.65, vx: 0, vz: 0, facing: side === 0 ? 1 : -1,
    crouch: false, stroke: { active: false, type: 0, t: 0, dur: .4 }, paddle: 0,
  };
}
const players = [makePlayer(0, -0.5), makePlayer(1, 0.6)];
function drawPlayers(time) {
  for (const pl of players) {
    /* 轻微来回移动，让骨架有步态（否则僵立） */
    pl.x = Math.sin(time * 0.9 + pl.side * 2) * 0.75;
    pl.vx = Math.cos(time * 0.9 + pl.side * 2) * 0.75 * 0.9;
    if (R.drawCharacter) R.drawCharacter(ctx, cam, pl, null, time, 0, false, false);
  }
}

/* ───────── 画法 A：现状火柴人（8 条路径/人） ───────── */
function drawFigures(time, mood) {
  const c = mood === 'cheer' ? 1 : 0;
  const sh = mood === 'shake' ? 1 : 0;
  for (const s of LIST) {
    const col = colOf(s);
    const rgb = `rgb(${col[0]},${col[1]},${col[2]})`;
    /* 复用真实 seatedPose（含欢呼举手 / 失望摇头），保证与产品一致 */
    const p = R.seatedPose(s, time, c, sh);
    const hp = cam.project(p.head), fp = cam.project(p.hips);
    if (!hp || !fp) continue;
    const hr = Math.max(1.2, .105 * Math.min(hp.s, fp.s) * .9);
    ctx.fillStyle = rgb;
    ctx.beginPath(); ctx.arc(hp.x, hp.y, hr, 0, 7); ctx.fill(); PATH_COUNT++;
    for (const [a, b] of [[p.hips, p.shoulder], [p.hips, p.kneeL], [p.hips, p.kneeR],
                          [p.kneeL, p.footL], [p.kneeR, p.footR], [p.shL, p.handL], [p.shR, p.handR]]) {
      R.limb(ctx, cam, a, b, .055, rgb, 'rgba(0,0,0,.55)'); PATH_COUNT++;
    }
  }
}

/* ───────── 画法 B：应援棒（2 条路径/人） ─────────
   ① 暗影 fillRect（不 stroke）
   ② 光棒 line + 端点圆，按队色分两批、每批只设一次 shadowColor
   近排衰减 + 远景补偿见 §3.2/3.3 */
function drawSticks(time, mood) {
  /* 远的先画 */
  const sorted = LIST.slice().sort((a, b) =>
    cam.depth(R.v3(b.x, b.y, b.z)) - cam.depth(R.v3(a.x, a.y, a.z)));

  /* 情绪 → 挥动速度 / 亮度 / 基础角度 */
  const speed = mood === 'cheer' ? 8.5 : mood === 'shake' ? 1.4 : 3.0;
  const bright = mood === 'cheer' ? 1 : mood === 'shake' ? 0.45 : 0.8;
  const droop = mood === 'shake' ? -0.9 : 0;      // 失望：棒垂下

  /* ① 暗影：代表"有人坐在这里"。
     ⚠ 尺寸必须按投影缩放 s 算，且要比真实人体小一圈：
     暗影只是"存在的暗示"，画大了会变成一片黑方块，把光棒全盖住（第一版就是这个毛病）。 */
  ctx.fillStyle = 'rgba(16,22,34,.72)';
  for (const s of sorted) {
    const b = cam.project(R.v3(s.x, s.y + .30, s.z));
    if (!b) continue;
    const w = Math.max(1.2, .13 * b.s);
    const h = Math.max(1.8, .22 * b.s);
    ctx.fillRect(b.x - w / 2, b.y - h / 2, w, h); PATH_COUNT++;
  }

  /* ② 光棒：按队色分两批 */
  ctx.lineCap = 'round';
  for (const team of [0, 1]) {
    const col = team === 0 ? RED : BLUE;
    for (const s of sorted) {
      if (teamOf(s) !== team) continue;
      const pb = cam.project(R.v3(s.x, s.y + .60, s.z));
      if (!pb) continue;

      /* 近排衰减：s 越大＝越近 ⇒ 压小压暗（等价景深虚化） */
      const sN = Math.max(0, Math.min(1, (pb.s - 60) / 90));
      const att = 1 - sN * P.att;
      /* 远景补偿：远排太细太暗会"消失" */
      const far = Math.max(0, Math.min(1, (110 - pb.s) / 50));

      const w = Math.max(1.4, .035 * pb.s * att) * (1 + far * .35);
      const alpha = Math.min(1, (.45 + .5 * (1 - sN)) * bright + far * .25);

      /* 挥动：绕握点扇形摆动，个体相位错开 ⇒ 波浪 */
      const swing = Math.sin(time * speed + s.ph) * P.swing * (mood === 'shake' ? .35 : 1) + droop;
      const L = .36 * (0.96 - sN * .35);
      const tip = R.v3(s.x + Math.sin(swing) * L, s.y + .60 + Math.cos(swing) * L, s.z);
      const pt = cam.project(tip);
      if (!pt) continue;

      ctx.shadowColor = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
      ctx.shadowBlur = P.glow * att * bright + 3;
      ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = w;

      ctx.beginPath(); ctx.moveTo(pb.x, pb.y); ctx.lineTo(pt.x, pt.y); ctx.stroke(); PATH_COUNT++;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(1, w * .85), 0, 7); ctx.fill(); PATH_COUNT++;
    }
  }
  ctx.shadowBlur = 0;
}

/* ───────── 主循环 ───────── */
let lastT = performance.now(), fpsAcc = [], t0 = performance.now();
function frame(now) {
  const dt = now - lastT; lastT = now;
  const time = (now - t0) / 1000;
  PATH_COUNT = 0;

  /* 背景 */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#080c14'); g.addColorStop(.55, '#0e1524'); g.addColorStop(1, '#0a1019');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  drawSceneBase(time);
  if (P.style === 'stick') drawSticks(time, P.mood);
  else drawFigures(time, P.mood);
  drawPlayers(time);

  /* HUD */
  fpsAcc.push(dt); if (fpsAcc.length > 30) fpsAcc.shift();
  const avg = fpsAcc.reduce((a, b) => a + b, 0) / fpsAcc.length;
  const fps = 1000 / avg;
  document.getElementById('paths').textContent = PATH_COUNT;
  document.getElementById('fps').textContent = fps.toFixed(0);
  document.getElementById('ms').textContent = avg.toFixed(1);
  document.getElementById('sN').textContent = LIST.length;
  document.getElementById('sP').textContent = PATH_COUNT;
  const figurePaths = LIST.length * 8;
  document.getElementById('sR').textContent = P.style === 'stick'
    ? `-${Math.round(100 * (1 - PATH_COUNT / figurePaths))}%`
    : '基准';

  requestAnimationFrame(frame);
}

/* ───────── 交互 ───────── */
function seg(id, key, cb) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...el.querySelectorAll('button')].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    cb(b.dataset.v);
  });
}
seg('styleSeg', 'style', v => { P.style = v; });
seg('densSeg', 'density', v => { P.density = +v; LIST = crowdLayout(P.density); });
seg('moodSeg', 'mood', v => { P.mood = v; });

const bind = (rid, vid, key, fmt) => {
  const r = document.getElementById(rid), v = document.getElementById(vid);
  r.addEventListener('input', () => { P[key] = +r.value; v.textContent = fmt(+r.value); });
};
bind('rAtt', 'vAtt', 'att', x => x.toFixed(2));
bind('rGlow', 'vGlow', 'glow', x => x.toFixed(0));
bind('rSwing', 'vSwing', 'swing', x => x.toFixed(2));

/* 拖动旋转 */
let drag = false, lx = 0, ly = 0;
cv.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('pointerup', () => { drag = false; });
window.addEventListener('pointermove', e => {
  if (!drag) return;
  P.yaw -= (e.clientX - lx) * 0.005;
  P.pitch = Math.max(-0.15, Math.min(0.55, P.pitch + (e.clientY - ly) * 0.003));
  lx = e.clientX; ly = e.clientY;
  updateCam();
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
