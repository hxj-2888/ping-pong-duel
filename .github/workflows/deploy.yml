# ===== GitHub Actions 鈥?鑷姩鏋勫缓 APK + Cloudflare Pages 閮ㄧ讲锛堜箳涔撳鍐筹級=====
# 瑙﹀彂: push 鍒?main锛堟垨鎵嬪姩 workflow_dispatch锛?# 娴佹按绾? 璇硶妫€鏌?鈫?鏋勫缓 APK锛圕I 鎵撳寘鏈€鏂扮増锛夆啋 Pages 閮ㄧ讲 鈫?Release 鍒锋柊 鈫?鍐掔儫楠岃瘉
# 渚濊禆 GitHub Secrets:
#   CF_API_TOKEN / CF_ACCOUNT_ID      Cloudflare锛圥ages + Workers Scripts Edit锛?#   PPD_KEYSTORE_B64                  android/release.keystore 鐨?base64锛堢鍚嶅瘑閽ワ級
#   PPD_KEYSTORE_PASS / PPD_KEY_PASS  绛惧悕瀵嗙爜
# 绛惧悕涓変欢濂楁湭閰嶇疆鏃讹細鏋勫缓 job 璺宠繃锛岄儴缃插洖閫€鍒?Release 閲岀殑鏃㈡湁 APK锛屾祦姘寸嚎淇濇寔缁裤€?# APK 鏂囦欢鍚嶅浐瀹?PingPongDuel-v300.apk锛坉ownload.html 渚濊禆锛夛紝鍐呭闅忔瘡娆℃瀯寤哄埛鏂般€?
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 璐ㄩ噺闂ㄧ: 鍏ㄩ儴 JS 璇硶妫€鏌?=====
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check all JS
        run: |
          find src public/js test tools -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js
          node --check desktop-launcher.js

      # 鏈湴鍙窇鐨勬祴璇曞浠讹紙鏃犲缃戜緷璧栵細鏈湴璧锋湇 / 绾€昏緫 / 妗╋級鈥斺€旇仈缃戝啋鐑熺被锛坵s-live 绛夛級涓嶈繘 CI
      - name: Run local test suite
        run: |
          for t in net-test http-robustness-test join-wait-test records-test restart-persist seq-test \
                   ws-frame-limit-test ws-reconnect-test ws-skin-test broadcast-floor-test lan-path-test \
                   engine-stress physics-boundary-test ai-test crowd-anim-cache-test crowd-anim-cycle-test \
                   crowd-count-consistency-test crowd-resize-consistency-test crowd-team-consistency-test \
                   smash-counter-test serve-deadzone-test replay-codec-test training-test input-mask-test \
                   do-smoke do-alarm do-persist net-retry-test serve-path-online browser-smoke; do
            echo "::group::test/$t.js"
            node "test/$t.js"
            echo "::endgroup::"
          done

  # ===== CI 鎵撳寘鏈€鏂扮増 APK =====
  build-apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install 7-Zip
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full

      # 绛惧悕涓変欢濂楋紙Secrets锛夐綈鍏ㄦ墠鏋勫缓锛涗换涓€缂哄け鍒欒烦杩囧苟璧?Release 鍥為€€
      - name: Check signing secrets
        id: secrets
        env:
          PPD_KEYSTORE_B64: ${{ secrets.PPD_KEYSTORE_B64 }}
          PPD_KEYSTORE_PASS: ${{ secrets.PPD_KEYSTORE_PASS }}
          PPD_KEY_PASS: ${{ secrets.PPD_KEY_PASS }}
        run: |
          if [ -z "$PPD_KEYSTORE_B64" ] || [ -z "$PPD_KEYSTORE_PASS" ] || [ -z "$PPD_KEY_PASS" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "鈿?绛惧悕 Secrets 鏈厤榻愶紙PPD_KEYSTORE_B64 / PPD_KEYSTORE_PASS / PPD_KEY_PASS锛夛紝璺宠繃 APK 鏋勫缓"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore keystore
        if: steps.secrets.outputs.present == 'true'
        env:
          PPD_KEYSTORE_B64: ${{ secrets.PPD_KEYSTORE_B64 }}
        run: echo "$PPD_KEYSTORE_B64" | base64 -d > android/release.keystore

      - name: Build signed APK
        id: build
        if: steps.secrets.outputs.present == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.PPD_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.PPD_KEY_PASS }}
        run: |
          chmod +x android/build.sh
          android/build.sh
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PingPongDuel-apk
          path: PingPongDuel.apk
          if-no-files-found: error

  # ===== Cloudflare Pages 闈欐€佺珯锛坧ublic/锛岀敓浜у垎鏀?main锛?====
  deploy-pages:
    name: Cloudflare Pages (production)
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 浼樺厛鐢ㄦ湰娆?CI 鏋勫缓鐨?APK锛涙瀯寤鸿璺宠繃鏃跺洖閫€ Release 鏃㈡湁鍖?      - name: Download CI-built APK
        continue-on-error: true
        if: needs.build-apk.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: PingPongDuel-apk
          path: public/

      - name: Fallback to Release APK
        if: needs.build-apk.outputs.built != 'true'
        run: |
          curl -fsSL --retry 3 -o public/PingPongDuel-v300.apk \
            "https://github.com/${{ github.repository }}/releases/download/v3.0.0/PingPongDuel-v300.apk"
          ls -l public/PingPongDuel-v300.apk

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=ping-pong-duel --branch=main --commit-hash=${{ github.sha }}

  # ===== 鐢ㄦ渶鏂?APK 鍒锋柊 GitHub Release锛堜繚鎸佸鐢ㄤ笅杞芥簮鍚屾锛?====
  publish-release:
    name: Refresh Release APK
    needs: build-apk
    if: needs.build-apk.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CI-built APK
        uses: actions/download-artifact@v4
        with:
          name: PingPongDuel-apk
          path: .

      - name: Upload to Release v3.0.0 (clobber)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv PingPongDuel.apk PingPongDuel-v300.apk
          gh release upload v3.0.0 PingPongDuel-v300.apk --repo "${{ github.repository }}" --clobber

  # ===== 鑱旀満 DO 瀹夸富 Worker锛坓ame-room锛屾簮鐮?src/锛?====
  # 闇€瑕?Token 鍚?Account 鈫?Workers Scripts 鈫?Edit 鏉冮檺锛?026-08-29 璧峰凡閰嶇疆锛?  deploy-room:
    name: Deploy game-room Worker
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy game-room (Durable Object)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler.room.toml

  # ===== 閮ㄧ讲鍚庡啋鐑熼獙璇?=====
  smoke-test:
    name: Post-deploy smoke test
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: 棣栭〉
        run: curl -fsSL -o /dev/null --max-time 30 "https://ping-pong-duel.pages.dev/"

      - name: 涓嬭浇椤?        run: curl -fsSL -o /dev/null --max-time 30 "https://ping-pong-duel.pages.dev/download.html"

      - name: APK 鐩撮摼
        run: curl -fsSL --max-time 60 -r 0-1024 "https://ping-pong-duel.pages.dev/PingPongDuel-v300.apk" -o /dev/null
