# ===== GitHub Actions — 自动构建 APK + Cloudflare Pages 部署（乒乓对决）=====
# 触发: push 到 main（或手动 workflow_dispatch）
# 流水线: 语法检查 → 构建 APK（CI 打包最新版）→ Pages 部署 → Release 刷新 → 冒烟验证
# 依赖 GitHub Secrets:
#   CF_API_TOKEN / CF_ACCOUNT_ID      Cloudflare（Pages + Workers Scripts Edit）
#   PPD_KEYSTORE_B64                  android/release.keystore 的 base64（签名密钥）
#   PPD_KEYSTORE_PASS / PPD_KEY_PASS  签名密码
# 签名三件套未配置时：构建 job 跳过，部署回退到 Release 里的既有 APK，流水线保持绿。
# APK 对外文件名 = PingPongDuel-v<version 紧凑串>.apk（package.json 真源推导），内容随每次构建刷新。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 质量门禁: 全部 JS 语法检查 =====
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check all JS
        run: |
          find src public/js test tools -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js
          node --check desktop-launcher.js

      # 本地可跑的测试套件（无外网依赖：本地起服 / 纯逻辑 / 桩）——联网冒烟类（ws-live 等）不进 CI
      - name: Run local test suite
        run: |
          for t in net-test http-robustness-test join-wait-test records-test restart-persist seq-test \
                   ws-frame-limit-test ws-reconnect-test ws-skin-test broadcast-floor-test lan-path-test \
                   engine-stress ai-test crowd-anim-cache-test crowd-anim-cycle-test \
                   crowd-count-consistency-test crowd-resize-consistency-test crowd-team-consistency-test \
                   smash-counter-test serve-deadzone-test replay-codec-test training-test input-mask-test \
                   do-smoke do-alarm do-persist net-retry-test serve-path-online; do
            echo "::group::test/$t.js"
            node "test/$t.js"
            echo "::endgroup::"
          done

  # ===== CI 打包最新版 APK =====
  build-apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install 7-Zip
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full

      # 签名三件套（Secrets）齐全才构建；任一缺失则跳过并走 Release 回退
      - name: Check signing secrets
        id: secrets
        env:
          PPD_KEYSTORE_B64: ${{ secrets.PPD_KEYSTORE_B64 }}
          PPD_KEYSTORE_PASS: ${{ secrets.PPD_KEYSTORE_PASS }}
          PPD_KEY_PASS: ${{ secrets.PPD_KEY_PASS }}
        run: |
          if [ -z "$PPD_KEYSTORE_B64" ] || [ -z "$PPD_KEYSTORE_PASS" ] || [ -z "$PPD_KEY_PASS" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "⚠ 签名 Secrets 未配齐（PPD_KEYSTORE_B64 / PPD_KEYSTORE_PASS / PPD_KEY_PASS），跳过 APK 构建"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore keystore
        if: steps.secrets.outputs.present == 'true'
        env:
          PPD_KEYSTORE_B64: ${{ secrets.PPD_KEYSTORE_B64 }}
        run: echo "$PPD_KEYSTORE_B64" | base64 -d > android/release.keystore

      - name: Build signed APK
        id: build
        if: steps.secrets.outputs.present == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.PPD_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.PPD_KEY_PASS }}
        run: |
          chmod +x android/build.sh
          android/build.sh
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: PingPongDuel-apk
          path: android/PingPongDuel.apk
          if-no-files-found: error

  # ===== Cloudflare Pages 静态站（public/，生产分支 main）=====
  deploy-pages:
    name: Cloudflare Pages (production)
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 优先用本次 CI 构建的 APK；构建被跳过时回退 Release 既有包。
      # ★ 必须改名成对外文件名：artifact 解出来是 PingPongDuel.apk，而下载页
      #   （download.html）与 _headers 固定的是带版本号的名字。不改名则下载链接
      #   落到 SPA 回退、返回 200 + HTML，用户下到的是网页。
      #   文件名从 package.json 真源推导，不再硬编码版本串——硬编码已在 v301
      #   停留多轮，与实际发布的 v300/v310/v320 全部脱节，导致下载按钮指向空。
      - name: Resolve published APK filename
        run: |
          short=$(node -p "require('./package.json').version.replace(/\./g,'')")
          echo "APK_NAME=PingPongDuel-v${short}.apk" | tee -a "$GITHUB_ENV"
          # 与 download.html / _headers 交叉校验：三者必须指向同一个文件名
          grep -q "$APK_NAME" public/download.html || { echo "::error::download.html 未引用 $APK_NAME"; exit 1; }
          grep -q "$APK_NAME" public/_headers || { echo "::error::_headers 未引用 $APK_NAME"; exit 1; }

      - name: Download CI-built APK
        continue-on-error: true
        if: needs.build-apk.outputs.built == 'true'
        uses: actions/download-artifact@v8
        with:
          name: PingPongDuel-apk
          path: public/

      - name: Rename APK to the published filename
        if: needs.build-apk.outputs.built == 'true'
        run: |
          mv public/PingPongDuel.apk "public/$APK_NAME"
          ls -l "public/$APK_NAME"

      # 构建被跳过时回退 Release 既有包；Release 侧的资产名随版本变，按当前版本号取
      - name: Fallback to Release APK
        if: needs.build-apk.outputs.built != 'true'
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v3.0.0"
          curl -fsSL --retry 3 -o "public/$APK_NAME" "$base/$APK_NAME"
          ls -l "public/$APK_NAME"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=ping-pong-duel --branch=main --commit-hash=${{ github.sha }}

  # ===== 用最新 APK 刷新 GitHub Release（保持备用下载源同步）=====
  publish-release:
    name: Refresh Release APK
    needs: build-apk
    if: needs.build-apk.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download CI-built APK
        uses: actions/download-artifact@v8
        with:
          name: PingPongDuel-apk
          path: android/

      - name: Upload to Release v3.0.0 (clobber)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 资产名与站点对外文件名保持一致，从 package.json 真源推导
          short=$(node -p "require('./package.json').version.replace(/\./g,'')")
          apk="PingPongDuel-v${short}.apk"
          mv android/PingPongDuel.apk "$apk"
          gh release upload v3.0.0 "$apk" --repo "${{ github.repository }}" --clobber

  # ===== 联机 DO 宿主 Worker（game-room，源码 src/）=====
  # 需要 Token 含 Account → Workers Scripts → Edit 权限（2026-08-29 起已配置）
  deploy-room:
    name: Deploy game-room Worker
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy game-room (Durable Object)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler.room.toml

  # ===== 部署后冒烟验证 =====
  smoke-test:
    name: Post-deploy smoke test
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 首页
        run: curl -fsSL -o /dev/null --max-time 30 "https://ping-pong-duel.pages.dev/"

      - name: 下载页
        run: curl -fsSL -o /dev/null --max-time 30 "https://ping-pong-duel.pages.dev/download.html"

      # 冒烟必须校验下载页真实引用的那个文件名：从 download.html 抠出来，
      # 而不是硬编码——写死版本号会让下载按钮指向空文件时冒烟仍然全绿。
      - name: 解析下载页引用的 APK 文件名
        id: apkname
        run: |
          name=$(grep -o 'PingPongDuel-v[0-9]\+\.apk' public/download.html | head -1)
          if [ -z "$name" ]; then echo "::error::download.html 未找到 APK 文件名"; exit 1; fi
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "download.html 引用：$name"

      # ★ 必须校验响应体真的是 APK：文件缺失时 SPA 回退会返回 200 + HTML，
      #   仅用 curl -f 只看状态码，历史上因此长期漏检（下载按钮指向网页）。
      #   刚部署完 CDN 边缘尚未收敛，故带重试。
      - name: APK 直链（校验确为 APK，而非 SPA 回退 HTML）
        run: |
          url="https://ping-pong-duel.pages.dev/${{ steps.apkname.outputs.file }}"
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' -r 0-511 "$url" -o /tmp/apk-head.bin \
               && [ "$(head -c 2 /tmp/apk-head.bin)" = "PK" ]; then
              echo "APK 直链正常（PK 头校验通过，第 $i 次尝试）"
              ls -l /tmp/apk-head.bin
              exit 0
            fi
            echo "第 $i 次未就绪（CDN 传播中），10s 后重试"
            sleep 10
          done
          echo "APK 直链未返回 APK（拿到的是 SPA 回退 HTML）"
          exit 1
